<div class="modal fade" id="modal_info" tabindex="-1" aria-labelledby="modal_infoLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal_infoLabel">訂單詳細資料</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <h4 class="mt-1 ms-3 text-dark" id="modalName"></h4>
                <div class="ms-3 me-3 mt-3">
                    <div class="row g-4">
                        <div class="col-6">
                            <p><i class="me-1 fa-solid fa-phone"></i> 手機: <span id="modalPhone"></span></p>
                        </div>
                        <div class="col-6">
                            <p><i class="me-1 fa-solid fa-envelope"></i> Email: <span id="modalEmail"></span></p>
                        </div>
                        <div class="col-6">
                            <p><i class="me-1 fa-solid fa-venus-mars"></i> 性別: <span id="modalGender"></span></p>
                        </div>
                        <div class="col-6">
                            <p><i class="me-1 fa-solid fa-music"></i> 訂單類別: <span id="modalMajor"></span></p>
                        </div>
                        <div class="col-6">
                            <p><i class="me-1 fa-solid fa-graduation-cap"></i> 訂單時間: <span id="modalEducation"></span></p>
                        </div>
                        <div class="col-6">
                            <p><i class="me-1 fa-solid fa-book-open"></i> 訂購商品: <span id="modalSubject"></span></p>
                        </div>
                        <div class="col-12">
                            <p><i class="me-1 fa-solid fa-dollar-sign"></i> 金額: <span id="modalExperience"></span></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark" data-bs-dismiss="modal">關閉</button>
                </div>
            </div>
        </div>
    </div>
</div>
